<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ParrotOS</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        /* Shell styles - always loaded */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            overflow: hidden; 
            touch-action: none;
        }
        
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; }
        
        /* Navigation Bar */
        #nav-bar {
            height: 60px;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            border-bottom: 2px solid #0f3460;
            user-select: none;
        }
        
        #nav-bar button {
            background: none;
            border: none;
            font-size: 24px;
            color: #4ecca3;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 8px;
            min-width: 50px;
        }
        
        #nav-bar button:active {
            background: #0f3460;
        }
        
        #nav-bar .title {
            font-size: 16px;
            color: #eee;
            font-weight: bold;
            text-align: center;
            flex: 1;
        }
        
        #nav-bar .home-btn {
            font-size: 22px;
        }
        
        #nav-bar .nav-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* App Content Area */
        #app-container {
            height: calc(100% - 60px);
            overflow: hidden;
            position: relative;
        }
        
        #app-container > div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        
        #app-container > div.active {
            display: flex;
            flex-direction: column;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #4ecca3;
            font-size: 24px;
            background: #1a1a2e;
        }
        
        /* App styles */
        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div id="nav-bar">
        <div class="nav-group">
            <button id="prev-btn" onclick="ParrotOS.nav.prev()">◄</button>
        </div>
        
        <span class="title" id="app-title" onclick="ParrotOS.nav.home()">🏠 Hem</span>
        
        <div class="nav-group">
            <button id="next-btn" onclick="ParrotOS.nav.next()">►</button>
            <button class="home-btn" onclick="ParrotOS.nav.home()">🏠</button>
        </div>
    </div>
    
    <!-- Dynamic App Content -->
    <div id="app-container">
        <div id="loading" class="loading">Laddar...</div>
    </div>

    <script src="/static/js/router.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/integrations/feeder.js"></script>
    <script src="/static/js/integrations/led.js"></script>
    <script>
        // ParrotOS Global Namespace
        window.ParrotOS = {
            apps: [],
            currentApp: null,
            timeoutId: null,
            config: {}
        };

        // Initialize on load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Load config
                const configRes = await fetch('/api/config');
                ParrotOS.config = await configRes.json();
                
                // Load app list
                ParrotOS.apps = await ParrotOS.router.getApps();
                
                // Set up navigation
                ParrotOS.nav.init();
                
                // Load home app by default
                await ParrotOS.nav.goTo('home');
                
                // Start touch reset timeout (reset on any touch)
                document.addEventListener('touchstart', () => ParrotOS.router.resetTimeout(), { passive: true });
                
                console.log('ParrotOS initialized');
            } catch (e) {
                console.error('Init error:', e);
                document.getElementById('loading').textContent = 'Fel: ' + e.message;
            }
        });
    </script>
</body>
</html>
