<!-- TV App - YouTube Video Player -->
<div class="app-content" style="padding: 0; margin: 0; height: 100%;">
    <div id="player-wrapper" style="width: 100%; height: 100%; position: relative;">
        <div id="player"></div>
    </div>
</div>

<script>
    // YouTube player variable
    var player;
    
    // Video ID - "singing parrots" related content
    // Using a popular parrot singing video
    var videoId = 'MlD2eN0KcFk'; // Parrots singing and dancing
    
    // Load YouTube IFrame API
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    
    // API ready callback
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'rel': 0,
                'showinfo': 0,
                'modestbranding': 1,
                'playsinline': 1,
                'loop': 1,
                'playlist': videoId,
                'enablejsapi': 1,
                'origin': window.location.origin
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }
    
    function onPlayerReady(event) {
        // Try to unmute and play
        try {
            player.unMute();
            player.setVolume(80);
        } catch(e) {
            console.log('Autoplay may be blocked, trying muted');
        }
    }
    
    function onPlayerStateChange(event) {
        // Loop video when it ends
        if (event.data === YT.PlayerState.ENDED) {
            player.seekTo(0);
            player.playVideo();
        }
    }
    
    // Prevent clicking on iframe from opening new tab
    document.getElementById('player-wrapper').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    });
    
    // Also add pointer-events to prevent link navigation
    document.getElementById('player').style.pointerEvents = 'none';
</script>
