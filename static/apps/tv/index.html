<!-- TV App - YouTube Videos for Parrots -->
<div id="tv-app" style="width: 100%; height: calc(100vh - 80px); position: relative; overflow: hidden;">
    <!-- YouTube Player Container - plays directly on open -->
    <div id="youtube-player" style="width: 100%; height: 100%; pointer-events: none;"></div>
</div>

<script>
(function() {
    // Relaxing bird sounds video - auto-plays and loops
    const videoConfig = {
        videoId: 'CqXeTN-xkm0' // Relaxing Bird Sounds 4K
    };
    
    let player = null;
    
    // Load YouTube IFrame API
    function loadYouTubeAPI() {
        if (window.YT && window.YT.Player) {
            return Promise.resolve();
        }
        return new Promise((resolve) => {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            window.onYouTubeIframeAPIReady = () => {
                resolve();
            };
        });
    }
    
    // Create YouTube player
    function createPlayer() {
        const playerContainer = document.getElementById('youtube-player');
        
        // Clear previous player
        playerContainer.innerHTML = '<div id="yt-player" style="width: 100%; height: 100%; pointer-events: none;"></div>';
        
        player = new YT.Player('yt-player', {
            height: '100%',
            width: '100%',
            videoId: videoConfig.videoId,
            playerVars: {
                autoplay: 1,
                controls: 0,
                disablekb: 1,
                fs: 0,
                iv_load_policy: 3,
                loop: 1,
                modestbranding: 1,
                playsinline: 1,
                rel: 0,
                showinfo: 0,
                playlist: videoConfig.videoId // Required for loop to work
            },
            events: {
                onReady: (event) => {
                    event.target.playVideo();
                },
                onStateChange: (event) => {
                    // Loop video when it ends
                    if (event.data === YT.PlayerState.ENDED) {
                        event.target.playVideo();
                    }
                },
                onError: (event) => {
                    console.error('YouTube Player Error:', event.data);
                }
            }
        });
    }
    
    // Initialize player immediately
    loadYouTubeAPI().then(() => {
        createPlayer();
    });
    
    // Set TV LED effect when entering the app
    if (window.ParrotOS && window.ParrotOS.led && window.ParrotOS.led.setEffect) {
        ParrotOS.led.setEffect('tv');
    }
})();
</script>
