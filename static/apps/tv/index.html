<!-- TV App - YouTube Playlist for Parrots -->
<div id="tv-app" style="width: 100%; height: calc(100vh - 120px); position: relative; overflow: hidden; background: #000;">
    <iframe 
        id="youtube-frame"
        style="width: 100%; height: 100%; border: none; pointer-events: none;"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
        allowfullscreen
        loading="lazy">
    </iframe>
</div>

<script>
(function() {
    // YouTube playlist with bird/parrot content - auto-plays and cycles through videos
    // Parrot Town TV Good Vibes playlist - many videos that cycle
    const playlistId = 'PLBV9v5mFzsjdZB8tQZF_E4NUnrPhYnm-F';
    
    // Build playlist embed URL - block all external interactions
    const embedUrl = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1&loop=1&controls=0&showinfo=0&modestbranding=0&rel=0&fs=0&disablekb=1&playsinline=1&origin=${window.location.origin}`;
    
    // Set the iframe src
    document.getElementById('youtube-frame').src = embedUrl;
    
    // Prevent all clicks and interactions
    document.getElementById('tv-app').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    });
    
    // Double-check pointer-events is none
    document.getElementById('youtube-frame').style.pointerEvents = 'none';
    
    // Also prevent on iframe itself
    const frame = document.getElementById('youtube-frame');
    frame.addEventListener('load', function() {
        frame.style.pointerEvents = 'none';
    });
})();
</script>
