<!-- Calm App - Andningsövning -->
<div class="app-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 80px);">
    <div class="breathing-circle" style="
        width: 120px; 
        height: 120px; 
        border-radius: 50%; 
        background: radial-gradient(#415a77, #1b263b);
        animation: breathe 4s ease-in-out infinite;
    "></div>
    <p style="margin-top: 20px; color: #778da9; font-size: 20px;">Shh...</p>
    <p style="margin-top: 10px; color: #555; font-size: 14px;">Andas in... andas ut...</p>
</div>

<style>
@keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.4); }
}

.breathing-circle {
    box-shadow: 0 0 30px rgba(65, 90, 119, 0.3);
}
</style>

<script>
(function() {
    // Set calm LED effect when entering the app
    if (window.ParrotOS && window.ParrotOS.led && window.ParrotOS.led.setEffect) {
        ParrotOS.led.setEffect('calm');
    }
})();
</script>
